<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#167d63">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="数学教材">
    <meta name="app-content-version" content="{{ site.data.build.version | default: 'development' }}">
    <meta name="app-content-published-at" content="{{ site.data.build.published_at | default: '1970-01-01T00:00:00.000Z' }}">
    <meta name="app-content-endpoint" content="{{ '/app-content-version.json' | absolute_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
    <link rel="icon" href="{{ '/assets/icons/app-icon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script src="{{ '/assets/js/app-content.js' | relative_url }}?v=20260731-app" defer></script>
  </head>
  <body class="layout-{{ page.layout | default: 'base' }}" data-baseurl="{{ site.baseurl }}">
    <div class="reading-meter" aria-hidden="true"><span id="reading-meter-value"></span></div>

    <header class="site-header">
      <div class="site-container header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回数学自学教材首页">
          <span class="brand-mark">π</span>
          <span class="brand-text">
            <strong>{{ site.author.name }}</strong>
            <small>{{ site.author.role }}</small>
          </span>
        </a>

        <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" title="打开导航">
          <span></span><span></span><span></span>
          <span class="sr-only">打开导航</span>
        </button>

        <nav class="site-nav" id="site-nav" aria-label="主导航">
          {% for item in site.nav %}
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          {% endfor %}
          <button class="pwa-install-button" id="pwa-install-button" type="button" hidden>安装应用</button>
          <button class="app-update-button" id="app-update-button" type="button" hidden>检查更新</button>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-container footer-grid">
        <div>
          <strong>{{ site.title }}</strong>
          <p>从具体问题进入，用抽象数学整理，再回到练习和应用中检验理解。</p>
        </div>
        <div>
          <span>学习主线</span>
          <p>小学 · 初中 · 高中 · 大学基础 · 专业进阶</p>
        </div>
        <div>
          <span>学习方法</span>
          <a href="{{ '/guide/' | relative_url }}">阅读学习路径</a>
        </div>
        <div>
          <span>支持与联系</span>
          <a href="{{ '/support/' | relative_url }}">赞赏支持与问题反馈</a>
        </div>
      </div>
    </footer>

    <div class="pwa-status" id="pwa-status" role="status" aria-live="polite" hidden>
      <span id="pwa-status-message"></span>
      <button class="pwa-update-button" id="pwa-update-button" type="button" hidden>立即更新</button>
      <button class="pwa-status-close" id="pwa-status-close" type="button" title="关闭通知" aria-label="关闭通知">&times;</button>
    </div>

    <script src="{{ '/assets/js/site.js' | relative_url }}?v=20260731-app" defer></script>
  </body>
</html>
