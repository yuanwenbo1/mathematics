<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">椭圆双曲线和抛物线的图像比较</title>
  <desc id="desc">三个坐标面板并列展示椭圆、双曲线和抛物线及其焦点。</desc>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="46" text-anchor="middle" font-size="29" font-weight="700" fill="#17221e">圆锥曲线：定义决定形状</text>
  <g transform="translate(35 78)">
    <rect width="280" height="300" rx="6" fill="#f6f8f7" stroke="#dce4df"/>
    <text x="140" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#17221e">椭圆</text>
    <line x1="35" y1="165" x2="245" y2="165" stroke="#89948f"/><line x1="140" y1="62" x2="140" y2="260" stroke="#89948f"/>
    <ellipse cx="140" cy="165" rx="92" ry="62" fill="#e4f2ed" stroke="#167d63" stroke-width="5"/>
    <circle cx="95" cy="165" r="6" fill="#d05d47"/><circle cx="185" cy="165" r="6" fill="#d05d47"/>
    <text x="140" y="286" text-anchor="middle" font-size="18" fill="#617069">到两焦点距离之和固定</text>
  </g>
  <g transform="translate(340 78)">
    <rect width="280" height="300" rx="6" fill="#f6f8f7" stroke="#dce4df"/>
    <text x="140" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#17221e">双曲线</text>
    <line x1="35" y1="165" x2="245" y2="165" stroke="#89948f"/><line x1="140" y1="62" x2="140" y2="260" stroke="#89948f"/>
    <path d="M38 85 C92 115 92 215 38 245 M242 85 C188 115 188 215 242 245" fill="none" stroke="#d05d47" stroke-width="5"/>
    <circle cx="82" cy="165" r="6" fill="#167d63"/><circle cx="198" cy="165" r="6" fill="#167d63"/>
    <text x="140" y="286" text-anchor="middle" font-size="18" fill="#617069">到两焦点距离之差固定</text>
  </g>
  <g transform="translate(645 78)">
    <rect width="280" height="300" rx="6" fill="#f6f8f7" stroke="#dce4df"/>
    <text x="140" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#17221e">抛物线</text>
    <line x1="35" y1="165" x2="245" y2="165" stroke="#89948f"/><line x1="85" y1="62" x2="85" y2="260" stroke="#89948f"/>
    <path d="M70 80 Q245 165 70 250" fill="none" stroke="#a77713" stroke-width="5"/>
    <circle cx="140" cy="165" r="6" fill="#d05d47"/>
    <line x1="40" y1="70" x2="40" y2="260" stroke="#167d63" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="140" y="286" text-anchor="middle" font-size="18" fill="#617069">到焦点与准线距离相等</text>
  </g>
</svg>
