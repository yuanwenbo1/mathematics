<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">向量加法的平行四边形法则</title>
  <desc id="desc">从同一起点出发的向量a和b构成平行四边形，对角线是向量a加b。</desc>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#167d63"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#d05d47"/></marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#a77713"/></marker>
  </defs>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="430" y="50" text-anchor="middle" font-size="29" font-weight="700" fill="#17221e">向量加法：平行四边形的对角线</text>
  <g transform="translate(120 380)">
    <path d="M0 0 L390 0" stroke="#167d63" stroke-width="7" marker-end="url(#arrow-green)"/>
    <path d="M0 0 L170 -230" stroke="#d05d47" stroke-width="7" marker-end="url(#arrow-red)"/>
    <path d="M0 0 L560 -230" stroke="#a77713" stroke-width="8" marker-end="url(#arrow-gold)"/>
    <path d="M390 0 L560 -230 M170 -230 L560 -230" stroke="#89948f" stroke-width="3" stroke-dasharray="10 8"/>
    <circle r="8" fill="#17221e"/>
    <text x="195" y="34" font-size="26" font-weight="700" fill="#167d63">a</text>
    <text x="58" y="-128" font-size="26" font-weight="700" fill="#d05d47">b</text>
    <text x="315" y="-132" font-size="27" font-weight="700" fill="#a77713">a + b</text>
  </g>
  <text x="430" y="430" text-anchor="middle" font-size="21" fill="#617069">先平移向量，不改变它的大小和方向</text>
</svg>
