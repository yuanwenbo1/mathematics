<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">导数是曲线在一点的切线斜率</title>
  <desc id="desc">抛物线y等于x平方在点一一处的切线斜率为二，并标出较远点形成的割线。</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="48" text-anchor="middle" font-size="29" font-weight="700" fill="#17221e">割线趋近切线：平均变化率趋近瞬时变化率</text>
  <g stroke="#e3e9e5" stroke-width="1">
    <path d="M100 100V450M180 100V450M260 100V450M340 100V450M420 100V450M500 100V450M580 100V450M660 100V450M740 100V450"/>
    <path d="M80 130H800M80 210H800M80 290H800M80 370H800M80 450H800"/>
  </g>
  <g stroke="#617069" stroke-width="3"><line x1="80" y1="450" x2="810" y2="450"/><line x1="260" y1="475" x2="260" y2="82"/></g>
  <path d="M120 270 Q330 690 540 130" fill="none" stroke="#167d63" stroke-width="6"/>
  <line x1="340" y1="477" x2="620" y2="103" stroke="#d05d47" stroke-width="5"/>
  <line x1="330" y1="520" x2="540" y2="170" stroke="#a77713" stroke-width="4" stroke-dasharray="11 8"/>
  <circle cx="420" cy="370" r="9" fill="#17221e"/>
  <circle cx="480" cy="270" r="8" fill="#a77713"/>
  <text x="395" y="402" font-size="21" fill="#17221e">P(1,1)</text>
  <text x="496" y="261" font-size="20" fill="#a77713">Q</text>
  <text x="624" y="104" font-size="22" font-weight="700" fill="#d05d47">切线斜率 f'(1)=2</text>
  <text x="530" y="191" font-size="20" fill="#a77713">割线</text>
  <text x="132" y="122" font-size="22" font-weight="700" fill="#167d63">y = x²</text>
</svg>
