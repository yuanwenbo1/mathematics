<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">边角边判定三角形全等</title>
  <desc id="desc">两个三角形分别标出两组对应边和夹角，说明边角边全等判定。</desc>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="50" text-anchor="middle" font-size="29" font-weight="700" fill="#17221e">SAS：两边及其夹角分别相等</text>
  <g fill="#e4f2ed" stroke="#167d63" stroke-width="5">
    <path d="M110 340 L360 340 L185 115 Z"/>
    <path d="M540 340 L790 340 L615 115 Z"/>
  </g>
  <g font-size="22" font-weight="700" fill="#17221e">
    <text x="90" y="370">A</text><text x="365" y="370">B</text><text x="174" y="102">C</text>
    <text x="520" y="370">D</text><text x="795" y="370">E</text><text x="604" y="102">F</text>
  </g>
  <g stroke="#d05d47" stroke-width="5">
    <path d="M230 330v20M660 330v20"/>
    <path d="M140 218l17 12M570 218l17 12"/>
  </g>
  <g fill="none" stroke="#a77713" stroke-width="5">
    <path d="M143 340 A35 35 0 0 1 131 310"/>
    <path d="M573 340 A35 35 0 0 1 561 310"/>
  </g>
  <text x="450" y="404" text-anchor="middle" font-size="23" fill="#617069">AB = DE，AC = DF，∠A = ∠D  ⇒  △ABC ≌ △DEF</text>
</svg>
