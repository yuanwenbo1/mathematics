name: Deploy Jekyll mathematics site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Prepare application runtime and content version
        shell: bash
        run: |
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          echo "CONTENT_PUBLISHED_AT=$PUBLISHED_AT" >> "$GITHUB_ENV"
          npm run build:runtime
          node scripts/write-build-info.mjs --version=${{ github.sha }} --target=web --publishedAt="$PUBLISHED_AT"

      - name: Test content update builder
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Build downloadable textbook update
        run: node scripts/build-content-pack.mjs --site=_site --baseurl=/mathematics --origin=https://yuanwenbo1.github.io --version=${{ github.sha }} --publishedAt="$CONTENT_PUBLISHED_AT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
